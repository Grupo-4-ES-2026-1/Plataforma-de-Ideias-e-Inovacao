@if (autenticado) {
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6" />
          <path d="M10 22h4" />
          <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z" />
        </svg>
      </span>
      <span class="sidebar-title">Plataforma de<br>Ideias e Inovação</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/home" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
        <span>Início</span>
      </a>

      <a routerLink="/propostas" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="4" rx="1" />
          <rect x="4" y="10" width="16" height="4" rx="1" />
          <rect x="4" y="16" width="16" height="4" rx="1" />
        </svg>
        <span>Propostas</span>
      </a>

      <a routerLink="/ranking" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19h16" />
          <path d="M6 19V11h4v8" />
          <path d="M10 19V7h4v12" />
          <path d="M14 19V4h4v15" />
        </svg>
        <span>Ranking</span>
      </a>

      <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/minhas-propostas" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16v14H4z" />
          <path d="M8 9h8M8 13h5" />
        </svg>
        <span>Minhas Propostas</span>
      </a>

      <a routerLink="/propostas/nova" routerLinkActive="active" class="sidebar-link sidebar-link-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v8M8 12h8" />
        </svg>
        <span>Nova Proposta</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <span class="sidebar-avatar">{{ iniciais() }}</span>
        <span class="sidebar-username">{{ usuarioLogado }}</span>
      </div>

      <button class="sidebar-logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>
} @else {
  <header class="topbar-guest">
    <span class="topbar-brand">Plataforma de Ideias e Inovação</span>
    <a routerLink="/login" class="topbar-link">Entrar</a>
  </header>
}
