server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona qualquer rota para o index.html, para o Angular Router
    # conseguir tratar as rotas no lado do cliente (evita erro 404 ao
    # recarregar a página em uma rota como /propostas/1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache mais agressivo para arquivos com hash no nome (JS/CSS gerados pelo build)
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
